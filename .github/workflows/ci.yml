name: Django React Lint CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Starting Lint Python Files job"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show job information
        run: |
          echo "Job name: Lint Python Files"
          echo "Runner OS: ${{ runner.os }}"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Run Django checks
        run: |
          python manage.py check
          python manage.py test

      - name: Run Python linter
        run: |
          echo "Running flake8 for Python files"
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          echo "Python lint completed successfully"

      - name: Complete Python lint job
        run: echo "Lint Python Files job completed successfully"

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Starting Lint JavaScript Files job"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show job information
        run: |
          echo "Job name: Lint JavaScript Files"
          echo "Runner OS: ${{ runner.os }}"
          echo "Repository: ${{ github.repository }}"
          echo "Run ID: ${{ github.run_id }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify JavaScript source files
        run: |
          echo "Verifying JavaScript source files"
          find server/frontend/src -type f \( -name '*.js' -o -name '*.jsx' \) -print
          echo "JavaScript source verification completed successfully"

      - name: Complete JavaScript lint job
        run: echo "Lint JavaScript Files job completed successfully"
